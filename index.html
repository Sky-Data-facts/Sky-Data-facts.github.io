<!DOCTYPE html>
<html>
<head>
    <title>Sky-Data-facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f7fb;
            color: #1a1a1a;
        }

        nav {
            position: sticky;
            top: 14px;
            z-index: 100;
            width: 100%;
            padding: 12px 16px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 760px;
            margin: 0 auto;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(142, 159, 179, 0.25);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(22, 33, 52, 0.12);
            backdrop-filter: blur(8px);
        }

        nav a {
            display: block;
            padding: 12px 18px;
            text-decoration: none;
            color: #1f2a37;
            font-weight: 700;
            letter-spacing: 0.02em;
            border-radius: 999px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        nav a:hover {
            background: #edf5ff;
            color: #0057d9;
            transform: translateY(-1px);
        }

        nav a.active {
            background: linear-gradient(135deg, #0057d9, #1a78ff);
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(0, 87, 217, 0.28);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        h1 {
            font-size: clamp(2.2rem, 4vw, 3rem);
            line-height: 1.2;
            margin-bottom: 25px;
            padding-top: 20px;
        }

        h2 {
            font-size: clamp(1.7rem, 3vw, 2.3rem);
            line-height: 1.3;
            margin-top: 30px;
            margin-bottom: 18px;
        }

        img,
        iframe,
        video {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-image {
            width: min(900px, 100%);
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .section-image {
            width: min(900px, 100%);
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        .video-wrap {
            width: min(1300px, 100%);
            margin: 20px auto 0;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        .figure-box {
            width: min(700px, 100%);
            margin: 30px auto 0;
        }

        .figure-box img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        .figure-box p {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
            margin-bottom: 0;
        }

        iframe {
            width: min(1100px, 100%);
            height: 400px;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .section {
            display: none;
            animation: fadeIn 0.4s ease-in;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            nav {
                top: 8px;
                padding: 8px 10px 0;
            }

            nav ul {
                gap: 8px;
                padding: 8px 10px;
            }

            nav a {
                padding: 10px 12px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a class="nav-link active" data-section="home">Startseite</a></li>
            <li><a class="nav-link" data-section="weather">Wetteraufzeichnungen</a></li>
            <li><a class="nav-link" data-section="guide">Schnellerklärung</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="home" class="section active">
            <h1>Sky-Data-facts!</h1>

            <img class="hero-image" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800"
                 alt="Himmel voller Sterne">
        </section>

        <section id="weather" class="section">
            <h2>Wetteraufzeichnungen</h2>

            <iframe
                src="https://films-cow-marie-tim.trycloudflare.com/public-dashboards/ffb45081d7f049b9a72819369cc81f77"
                width="100%"
                height="400"
                frameborder="0">
            </iframe>
        </section>

        <section id="guide" class="section">
            <h2>Schnellerklärung (Anleitung)</h2>

            <img class="section-image" src="Schnellerklärung.png" alt="Schnellerklärung">

            <div class="video-wrap">
                <video autoplay loop muted playsinline>
                  <source src="Grafana Schnellerklärung Zeitausschnitt markieren.mp4" type="video/mp4">
                </video>
            </div>

            <div class="figure-box">
              <img src="https://images.unsplash.com/photo-1729158323174-504d2e3234f3?q=80&w=411&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                   alt="Eine Person, die mitten in einem Gewässer steht">
              <p>Eine Person, die mitten in einem Gewässer steht</p>
            </div>
        </section>
    </div>

    <script>
        const navLinks = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('.section');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();

                const targetSection = link.getAttribute('data-section');

                // Entferne active-Klasse von allen Links und Sections
                navLinks.forEach(l => l.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));

                // Füge active-Klasse zum angeklickten Link und der entsprechenden Section hinzu
                link.classList.add('active');
                document.getElementById(targetSection).classList.add('active');
            });
        });
    </script>
</body>
</html>
